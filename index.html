<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 08: interação JS e HTML </title>
</head>
<body>
    <h3>Data:11/09/2026</h3>
    <table border="1">
        <tr>
            <td>
                <button id="ant"> anterior</button>
                <button id="prox"> proximo</button>
            </td>
            <td rowspan="4">
                <img id="foto" src="./img/foto1.jpg" width="350px" />
            </td>
        </tr>
        <tr>
            <td>
                <select id="combobox">
                    <option value="1">mel</option>
                    <option value="2">balu</option>

                    <option value="5">pitomba</option>

                </select>
            </td>
        </tr>
        <tr>
            <td>
                <ul>
                    <li id="p1">mel</li>
                    <li id="p2">balu</li>
                    <li id="p3">zoey</li>
                    <li id="p4">aia</li>
                    <li id="p5">pitomba</li>
                    <li id="p6">bombom</li>
                </ul>
            </td>
        </tr>
        <tr>
            <td>
                <input type="range" id="opacidade" min="0" max="1" step="0.1" value="1">
            </td>
        </tr>
    </table>

    <script src="./js/app1.js" defer ></script>

</html>
